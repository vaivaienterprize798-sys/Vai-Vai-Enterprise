<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>RSR Vai Vai Enterprise ERP</title>
    <meta name="description" content="Comprehensive enterprise management software for mobile circuit & motherboard trading with 4-type invoicing, auto stock, payroll, expense tracking, and 1-page print optimization." />
    <meta name="theme-color" content="#071d3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RSR Vai Vai" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="RSR Vai Vai Enterprise ERP - Management System" />
    <meta property="og:description" content="Comprehensive enterprise management software for mobile circuit & motherboard trading with 4-type invoicing, auto stock, payroll, expense tracking, and 1-page print optimization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <!-- Pre-render Splash / White-Screen Prevention Container -->
      <div id="__rsr_splash__" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #071d3a; color: #ffffff; font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 72px; height: 72px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="3" ry="3"></rect>
            <path d="M7 2v20"></path>
            <path d="M17 2v20"></path>
            <path d="M2 12h20"></path>
            <path d="M2 7h5"></path>
            <path d="M2 17h5"></path>
            <path d="M17 17h5"></path>
            <path d="M17 7h5"></path>
          </svg>
        </div>
        <h1 style="margin: 0 0 6px 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff;">
          RSR VAI VAI ENTERPRISE
        </h1>
        <p style="margin: 0 0 20px 0; font-size: 13px; color: #94a3b8;">
          মোবাইল সার্কিট ও মাদারবোর্ড ইনভেন্টরি ম্যানেজমেন্ট সিস্টেম
        </p>
        
        <div style="width: 160px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #38bdf8; border-radius: 99px; animation: rsr_progress 1.2s infinite ease-in-out;"></div>
        </div>
        <p style="margin-top: 12px; font-size: 12px; color: #64748b;">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>

        <!-- Auto Recovery Button (appears if app takes > 3.5s or white screen occurs) -->
        <div id="__rsr_troubleshoot__" style="display: none; margin-top: 24px; max-width: 380px; padding: 16px; background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;">
          <p style="margin: 0 0 12px 0; font-size: 12px; color: #f59e0b; line-height: 1.4;">
            ডেস্কটপ অ্যাপের স্ক্রিন লোড হতে সমস্যা হচ্ছে? নিচের বাটনে চাপ দিয়ে ক্যাশ রিসেট ও রিস্টোর করুন:
          </p>
          <button onclick="window.__rsr_force_clean_reload && window.__rsr_force_clean_reload()" style="background: #10b981; color: #ffffff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;">
            ক্যাশ রিসেট ও অ্যাপ রিস্টার্ট করুন
          </button>
        </div>
      </div>
      <style>
        @keyframes rsr_progress {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(100%); }
          100% { transform: translateX(300%); }
        }
      </style>
    </div>

    <!-- Self-Healing White Screen Handler -->
    <script>
      window.__rsr_force_clean_reload = function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
        } catch(e) {}
        setTimeout(function() {
          window.location.reload(true);
        }, 300);
      };

      // Reveal recovery button if React hasn't mounted in 3.5 seconds
      setTimeout(function() {
        var tb = document.getElementById('__rsr_troubleshoot__');
        if (tb && document.getElementById('__rsr_splash__')) {
          tb.style.display = 'block';
        }
      }, 3500);

      // Handle unhandled errors that prevent app bootstrap
      window.addEventListener('error', function(event) {
        var tb = document.getElementById('__rsr_troubleshoot__');
        if (tb) {
          tb.style.display = 'block';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
