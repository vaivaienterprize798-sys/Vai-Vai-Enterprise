<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="RSR Vai Vai Enterprise - Complete Business Management ERP" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>RSR Vai Vai Enterprise</title>
    <meta property="og:title" content="RSR Vai Vai Enterprise" />
    <meta property="og:description" content="RSR Vai Vai Enterprise - Complete Business Management ERP" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vai Vai" />
    <meta name="twitter:card" content="summary" />
    <style>
      #__rsr_splash__{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#1e293b 0%,#0f172a 70%);will-change:opacity}
      #__rsr_splash__ .c{text-align:center;color:#f8fafc;font-family:Outfit,'Hind Siliguri',sans-serif;animation:rsrIn .5s ease-out both}
      #__rsr_splash__ img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px rgba(16,185,129,.35);animation:rsrPulse 1.6s ease-in-out infinite}
      #__rsr_splash__ h1{margin:18px 0 4px;font-size:22px;font-weight:800;letter-spacing:.5px}
      #__rsr_splash__ p{margin:0;font-size:13px;color:#94a3b8}
      #__rsr_splash__ .bar{width:140px;height:4px;margin:20px auto 0;border-radius:4px;background:#334155;overflow:hidden}
      #__rsr_splash__ .bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#10b981,#38bdf8);animation:rsrBar 1s ease-in-out infinite}
      @keyframes rsrIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
      @keyframes rsrPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes rsrBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    </style>
</head>
  <body>
    <div id="__rsr_splash__"><div class="c"><img src="/icon-192.png" alt="" /><h1>RSR Vai Vai Enterprise</h1><p>Business Management ERP</p><div class="bar"><i></i></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
